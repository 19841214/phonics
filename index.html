<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phonics Fireworks - 聲控煙火秀</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Noto+Sans+TC:wght@500&display=swap');

        body { 
            margin: 0; 
            overflow: hidden; 
            background: #111; 
            font-family: 'Fredoka One', cursive, sans-serif;
            user-select: none;
            -webkit-touch-callout: none; /* iOS 禁止長按選單 */
        }

        canvas { 
            display: block; 
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ui {
            position: absolute;
            top: 45%; /*稍微往上，留空間給麥克風 */
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            width: 100%;
        }

        .word-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        #word-display {
            font-size: 7rem; /* 稍微調小適應手機 */
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8), 4px 4px 0px #333;
            letter-spacing: 5px;
            transition: transform 0.2s, opacity 0.3s;
            cursor: pointer;
        }
        
        #chinese-hint {
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 1.8rem;
            color: #aaa;
            margin-top: 10px;
            opacity: 0.8;
            font-weight: normal;
        }

        #status {
            color: #00ffaa;
            margin-top: 15px;
            font-size: 1.2rem;
            font-family: 'Noto Sans TC', sans-serif;
            min-height: 1.5em;
            text-shadow: 1px 1px 2px #000;
        }

        /* 通用按鈕樣式 */
        .btn {
            padding: 15px 30px;
            font-size: 1.5rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Noto Sans TC', sans-serif;
            outline: none;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }

        #start-btn {
            background: linear-gradient(135deg, #ff0055, #ff5500);
            color: white;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
            margin-top: 20px;
        }

        #hint-btn {
            background: rgba(255, 255, 255, 0.15);
            color: #ddd;
            font-size: 1rem;
            padding: 8px 16px;
            margin-top: 10px;
            border-radius: 20px;
            border: 1px solid #555;
            display: none;
        }

        /* --- 麥克風按鈕專區 --- */
        #mic-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: none; /* 開始後才顯示 */
            flex-direction: column;
            align-items: center;
        }

        #mic-btn {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(145deg, #222, #333);
            border: 4px solid #555;
            color: white;
            font-size: 3rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* 按住時的效果 */
        #mic-btn.active {
            background: #ff0055;
            border-color: #ffaaaa;
            box-shadow: 0 0 30px #ff0055, inset 0 0 10px rgba(0,0,0,0.2);
            transform: scale(1.1);
        }

        #mic-hint {
            margin-top: 10px;
            color: #888;
            font-size: 1rem;
            font-family: 'Noto Sans TC', sans-serif;
        }

        #loading {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #111;
            z-index: 30;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            font-family: 'Noto Sans TC', sans-serif;
        }
        
        .loader {
            border: 5px solid #333;
            border-top: 5px solid #ff0055;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- 載入層 -->
    <div id="loading">
        <div class="loader"></div>
        <div id="loading-text">正在從 Google Sheet 載入題庫...</div>
    </div>

    <!-- 遊戲 UI -->
    <div id="ui">
        <div class="word-container">
            <div id="word-display">READY?</div>
            <div id="chinese-hint"></div>
        </div>
        
        <button id="start-btn" class="btn" onclick="startGame()">點擊開始 Start</button>
        <div id="status"></div>
        <button id="hint-btn" class="btn" onclick="playHint()">🔊 提示音</button>
    </div>

    <!-- 麥克風控制區 (取代原本的自動偵測) -->
    <div id="mic-container">
        <div id="mic-btn">🎤</div>
        <div id="mic-hint">按住說話</div>
    </div>

    <canvas id="canvas"></canvas>

<script>
    // --- 0. 音效資產設定 ---
    const audioAssets = {
        bgm: new Audio('https://cdn.pixabay.com/download/audio/2024/11/20/audio_6785a146c9.mp3?filename=abdipr-neko-komorebi-chill-lo-fi-266788.mp3'),
        firework: new Audio('https://cdn.pixabay.com/download/audio/2022/03/15/audio_4056c4bffc.mp3?filename=freesound_community-single-firework-79814.mp3'),
        success: new Audio('https://cdn.pixabay.com/download/audio/2023/11/12/audio_30bd7ff18f.mp3?filename=musheran-win-176035.mp3'),
        error: new Audio('https://cdn.pixabay.com/download/audio/2022/02/11/audio_7f0bf4cdc0.mp3?filename=eritnhut1992-buzzer-or-wrong-answer-20582.mp3'),
        ui: new Audio('https://cdn.pixabay.com/download/audio/2025/09/18/audio_37de472eec.mp3?filename=dragon-studio-bubble-pop-406640.mp3'),
        micStart: new Audio('https://cdn.pixabay.com/download/audio/2022/03/24/audio_c8c2a5c5a6.mp3?filename=uiclick-97915.mp3') // 新增：按鈕音效
    };

    // 初始化 BGM
    audioAssets.bgm.loop = true;
    audioAssets.bgm.volume = 0.5;

    // Helper: 播放音效
    function playSound(type) {
        if (!audioAssets[type]) return;
        
        // 錯誤音效播放時，絕對不應該在收音，這裡只是播放聲音
        if (type === 'firework') {
            const clone = audioAssets.firework.cloneNode();
            clone.volume = 0.6;
            clone.play().catch(()=>{});
        } else if (type === 'micStart') {
            const clone = audioAssets.micStart.cloneNode();
            clone.volume = 0.4;
            clone.play().catch(()=>{});
        } else {
            audioAssets[type].currentTime = 0;
            audioAssets[type].play().catch(e => console.log("Audio play failed", e));
        }
    }

    // Helper: 音量淡入淡出 (Audio Ducking)
    let fadeInterval;
    function fadeBGM(targetVol) {
        clearInterval(fadeInterval);
        fadeInterval = setInterval(() => {
            if (!audioAssets.bgm) { clearInterval(fadeInterval); return; }
            const currentVol = audioAssets.bgm.volume;
            if (Math.abs(currentVol - targetVol) < 0.05) {
                audioAssets.bgm.volume = targetVol;
                clearInterval(fadeInterval);
            } else if (currentVol > targetVol) {
                audioAssets.bgm.volume -= 0.05;
            } else {
                audioAssets.bgm.volume += 0.05;
            }
        }, 50);
    }

    // --- Utility: Levenshtein Distance (模糊比對) ---
    function getLevenshteinDistance(a, b) {
        if (a.length === 0) return b.length;
        if (b.length === 0) return a.length;
        const matrix = [];
        for (let i = 0; i <= b.length; i++) matrix[i] = [i];
        for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
        for (let i = 1; i <= b.length; i++) {
            for (let j = 1; j <= a.length; j++) {
                if (b.charAt(i - 1) === a.charAt(j - 1)) {
                    matrix[i][j] = matrix[i - 1][j - 1];
                } else {
                    matrix[i][j] = Math.min(
                        matrix[i - 1][j - 1] + 1,
                        Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1)
                    );
                }
            }
        }
        return matrix[b.length][a.length];
    }

    // --- 變數與資料 ---
    const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSXSoov0tHBR7WZIEsFe89P_hE0iLbcMryPzaRHoUqIodf9RIQbCxEhuExj4NYhRRbor6dZ0FDUqtdE/pub?gid=0&single=true&output=csv';
    let words = []; 
    let currentWordObj = null;
    let recognition;
    let isMicHeld = false; // 追蹤按鈕是否被按著

    // --- 1. 資料載入 ---
    async function loadWordsFromSheet() {
        const loadingDiv = document.getElementById('loading');
        try {
            const response = await fetch(GOOGLE_SHEET_CSV_URL);
            if (!response.ok) throw new Error("Network response was not ok");
            const data = await response.text();
            
            const rows = data.split('\n').map(row => row.trim()).filter(row => row.length > 0);
            if (rows.length > 0) rows.shift();

            words = rows.map(row => {
                const columns = row.split(',');
                return {
                    text: columns[0] ? columns[0].trim().toUpperCase() : "ERROR",
                    chinese: columns[2] ? columns[2].trim() : ""
                };
            }).filter(w => w.text !== "ERROR" && w.text !== "");

            loadingDiv.style.display = 'none';
        } catch (error) {
            console.error("載入失敗:", error);
            // 備用
            words = [{ text: "CAT", chinese: "貓" }, { text: "DOG", chinese: "狗" }];
            setTimeout(() => { loadingDiv.style.display = 'none'; }, 2000);
        }
    }

    // --- 2. UI 邏輯 ---
    const wordDisplay = document.getElementById('word-display');
    const chineseDisplay = document.getElementById('chinese-hint');
    const statusDisplay = document.getElementById('status');
    const startBtn = document.getElementById('start-btn');
    const hintBtn = document.getElementById('hint-btn');
    const micContainer = document.getElementById('mic-container');
    const micBtn = document.getElementById('mic-btn');
    const micHint = document.getElementById('mic-hint');

    function startGame() {
        playSound('ui');
        if (words.length === 0) { alert("題庫載入中..."); return; }

        audioAssets.bgm.play().catch(e => console.log("BGM autoplay prevented", e));
        
        // 初始化語音辨識 (但不開始，等按鈕)
        initSpeechRecognition();

        startBtn.style.display = 'none';
        micContainer.style.display = 'flex'; // 顯示麥克風按鈕
        hintBtn.style.display = 'inline-block';
        nextWord();
    }

    function nextWord() {
        const randomIndex = Math.floor(Math.random() * words.length);
        currentWordObj = words[randomIndex];
        
        wordDisplay.style.opacity = 0;
        wordDisplay.style.transform = "scale(0.5)";
        
        setTimeout(() => {
            wordDisplay.innerText = currentWordObj.text;
            chineseDisplay.innerText = currentWordObj.chinese;
            wordDisplay.style.opacity = 1;
            wordDisplay.style.transform = "scale(1)";
            statusDisplay.innerText = "按住下方麥克風說話";
            statusDisplay.style.color = "#00ffaa";
        }, 300);
    }

    function playHint() {
        playSound('ui');
        if (!currentWordObj) return;
        fadeBGM(0.1);
        const utterance = new SpeechSynthesisUtterance(currentWordObj.text);
        utterance.lang = 'en-US';
        utterance.rate = 0.8;
        utterance.onend = () => { 
            // 只有在沒有按住麥克風時才恢復音量
            if (!isMicHeld) fadeBGM(0.5); 
        };
        speechSynthesis.speak(utterance);
    }

    // --- 3. 麥克風按鈕互動邏輯 (Push to Talk) ---
    // 支援滑鼠與觸控
    micBtn.addEventListener('mousedown', startListening);
    micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startListening(); });
    
    // 放開時停止
    micBtn.addEventListener('mouseup', stopListening);
    micBtn.addEventListener('mouseleave', stopListening); // 滑鼠移出也算放開
    micBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopListening(); });

    function startListening() {
        if (isMicHeld || !recognition) return;
        isMicHeld = true;
        
        playSound('micStart');
        micBtn.classList.add('active');
        micHint.innerText = "聆聽中...";
        statusDisplay.innerText = "Listening...";
        statusDisplay.style.color = "#fff";

        fadeBGM(0.1); // BGM 變小

        try {
            recognition.start();
        } catch (e) {
            console.log("Recognition start error (already started?):", e);
        }
    }

    function stopListening() {
        if (!isMicHeld) return;
        isMicHeld = false;

        micBtn.classList.remove('active');
        micHint.innerText = "按住說話";
        
        // 恢復 BGM (稍後 checkAnswer 會決定是否繼續)
        fadeBGM(0.5); 

        if (recognition) {
            recognition.stop();
        }
    }

    // --- 4. 語音辨識設定 ---
    function initSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("瀏覽器不支援，請用 Chrome/Android。");
            return;
        }

        recognition = new SpeechRecognition();
        // 改為 false，因為我們手動控制 start/stop
        recognition.continuous = true; 
        recognition.interimResults = false;
        recognition.maxAlternatives = 10; 
        recognition.lang = 'en-US';

        recognition.onresult = (event) => {
            const last = event.results.length - 1;
            const resultList = event.results[last];
            checkAnswer(resultList);
        };

        recognition.onerror = (event) => {
            console.log("Error:", event.error);
            if (event.error === 'no-speech') {
                statusDisplay.innerText = "沒聽到聲音...";
            }
        };
        
        // 不再自動 restart (onend 空著即可，或做狀態清理)
        recognition.onend = () => {
            console.log("Recognition ended");
            // 確保按鈕狀態復原 (萬一系統自動斷開)
            if (isMicHeld) {
                isMicHeld = false;
                micBtn.classList.remove('active');
                fadeBGM(0.5);
            }
        };
    }

    // --- 5. 答案檢查邏輯 ---
    function checkAnswer(resultList) {
        if (!currentWordObj) return;
        
        // 因為是 onresult 觸發，此時手應該已經放開，麥克風已停止
        // 這符合「錯誤/正確時不應繼續收音」的需求

        const target = currentWordObj.text;
        let found = false;
        let topTranscript = "";

        if (!resultList || resultList.length === 0) return;
        topTranscript = resultList[0].transcript.trim().toUpperCase();

        for (let i = 0; i < resultList.length; i++) {
            let transcript = resultList[i].transcript.trim().toUpperCase();
            transcript = transcript.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");

            if (transcript.includes(target)) { found = true; break; }

            if (target.length > 3) {
                const wordsInTranscript = transcript.split(/\s+/);
                for (let w of wordsInTranscript) {
                    if (getLevenshteinDistance(w, target) <= 1) {
                        found = true; break;
                    }
                }
            }
            if (found) break;
        }
        
        if (found) {
            successTrigger();
        } else {
            playSound('error'); // 這裡播放錯誤音效，此時 mic 已經 stop 了
            statusDisplay.innerText = `聽到: ${topTranscript} ... 再試一次`;
            statusDisplay.style.color = "#ffaaaa";
        }
    }

    function successTrigger() {
        playSound('success');
        statusDisplay.innerText = "太棒了！ Good Job!";
        statusDisplay.style.color = "#ffff00";

        wordDisplay.style.transform = "scale(1.5)";
        wordDisplay.style.opacity = 0; 

        createExplosion(window.innerWidth / 2, window.innerHeight / 2);
        setTimeout(() => createExplosion(window.innerWidth / 2 - 150, window.innerHeight / 2 + 50), 200);
        setTimeout(() => createExplosion(window.innerWidth / 2 + 150, window.innerHeight / 2 - 50), 400);

        const praise = ["Great!", "Awesome!", "Good Job!", "Nice!", "Fantastic!"];
        const utterance = new SpeechSynthesisUtterance(praise[Math.floor(Math.random()*praise.length)]);
        speechSynthesis.speak(utterance);

        setTimeout(nextWord, 2000);
    }

    // --- 6. Canvas 粒子 ---
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y;
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 8 + 2; 
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.life = 100;
            this.color = color;
            this.gravity = 0.15;
            this.drag = 0.95;
            this.size = Math.random() * 4 + 2;
        }
        update() {
            this.vx *= this.drag; this.vy *= this.drag; this.vy += this.gravity;
            this.x += this.vx; this.y += this.vy;
            this.life -= 1.5; this.size *= 0.98;
        }
        draw() {
            ctx.globalAlpha = Math.max(0, this.life / 100);
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    }

    function createExplosion(x, y) {
        playSound('firework');
        const colors = ['#FF1461', '#18FF92', '#5A87FF', '#FBF38C'];
        for (let i = 0; i < 80; i++) { 
            const color = colors[Math.floor(Math.random() * colors.length)];
            particles.push(new Particle(x, y, color));
        }
    }

    function animate() {
        ctx.fillStyle = 'rgba(17, 17, 17, 0.2)';
        ctx.fillRect(0, 0, width, height);
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            particles[i].draw();
            if (particles[i].life <= 0) particles.splice(i, 1);
        }
        requestAnimationFrame(animate);
    }
    
    animate();
    loadWordsFromSheet();

</script>
</body>
</html>
